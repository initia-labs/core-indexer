name: Brotli runtime

on:
  pull_request:
    paths:
      - "dockerfiles/Dockerfile.generic"
      - "dockerfiles/check-brotli.c"
      - ".github/workflows/brotli-runtime.yml"
  push:
    branches: [main]
    paths:
      - "dockerfiles/Dockerfile.generic"
      - "dockerfiles/check-brotli.c"
      - ".github/workflows/brotli-runtime.yml"

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime libraries (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify native runtime libraries
        run: docker build --pull --target runtime-deps -f dockerfiles/Dockerfile.generic .
