image: ghcr.io/initia-labs/event-indexer:main
imagePullPolicy: null
imagePullSecret: null
replicas: 1

# Pub/Sub: set PUBSUB_PROJECT_ID and PUBSUB_ENDPOINT (regional endpoint).
# BLOCK_RESULTS_SUBSCRIPTION: <chain>-event-indexer
# Use the network KSA from zone-ops; see docs/pubsub.md for values and IAM.
# See docs/pubsub.md for resource creation and IAM.
# List of environment variables
env: {}

# List of ConfigMap/Secret references for environment variables
envFrom: []
  # For example:
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret

resources:
  requests:
    cpu: 500m
    memory: 1Gi

  limits:
    cpu: 500m
    memory: 1Gi

annotations: {}

serviceAccountName: null
