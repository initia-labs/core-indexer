image: ghcr.io/initia-labs/uploader:main
imagePullPolicy: null
imagePullSecret: null
replicas: 1

# Pub/Sub: set PUBSUB_PROJECT_ID and PUBSUB_ENDPOINT (regional endpoint).
# Set TX_RESPONSE_SUBSCRIPTION to this uploader's subscription ID.
# See docs/pubsub.md for resource creation and IAM.
# List of environment variables
env: {}

# List of ConfigMap/Secret references for environment variables
envFrom: []
  # For example:
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret

resources:
  requests:
    cpu: 500m
    memory: 1Gi

  limits:
    cpu: 500m
    memory: 1Gi

annotations: {}

serviceAccountName: null
