services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "8080:8080"
    restart: always
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hasura_metadata
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    container_name: gcs
    image: fsouza/fake-gcs-server
    restart: always
    ports:
      - "9184:9184"
    volumes:
      - storage:/storage/${CHAIN}-local-informative-indexer-large-block-results
      - storage_tx:/storage/${CHAIN}-local-tx-response-claim-check
#      - storage:/storage/${CHAIN}-local-core-informative-data-backup
    command: -scheme http -port 9184

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--project=core-indexer-local", "--host-port=0.0.0.0:8085"]
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8085), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  pubsub-init:
    image: python:3.12-slim
    environment:
      PUBSUB_PROJECT_ID: core-indexer-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      CHAIN: ${CHAIN}
    volumes:
      - ./init-pubsub.py:/init-pubsub.py:ro
    command: ["python3", "/init-pubsub.py"]
    depends_on:
      pubsub:
        condition: service_healthy

  sweeper:
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile.sweeper
    container_name: sweeper
    environment:
      RPC_ENDPOINTS: '{"rpcs":[{"url": "https://rpc.testnet.initia.xyz"}]}'
      PUBSUB_PROJECT_ID: core-indexer-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      DB_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BLOCK_RESULTS_TOPICS: ${CHAIN}-local-block-results
      CHAIN: ${CHAIN}
      ENVIRONMENT: ${ENVIRONMENT}
      CLAIM_CHECK_BUCKET: ${CHAIN}-local-informative-indexer-large-block-results
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    command: [ "/sweeper", "sweep" ]

  indexer:
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile.informative
    container_name: indexer
    environment:
      RPC_ENDPOINTS: '{"rpcs":[{"url": "https://rpc.testnet.initia.xyz"}]}'
      TX_RESPONSE_TOPIC: ${CHAIN}-local-tx-responses
      TX_CLAIM_CHECK_BUCKET: ${CHAIN}-local-tx-response-claim-check
      PUBSUB_PROJECT_ID: core-indexer-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      BLOCK_RESULTS_SUBSCRIPTION: ${CHAIN}-local-informative-indexer-indexer
      BLOCK_RESULTS_CLAIM_CHECK_BUCKET: ${CHAIN}-local-informative-indexer-large-block-results
      CLAIM_CHECK_THRESHOLD_IN_MB: 1
      DB_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHAIN: ${CHAIN}
      ENVIRONMENT: ${ENVIRONMENT}
      ID: 1
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    command: [ "/informative-indexer", "run" ]

